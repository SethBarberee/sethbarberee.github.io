

<!DOCTYPE HTML>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""/>
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin=""></script>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol/dist/L.Control.Locate.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/leaflet.locatecontrol/dist/L.Control.Locate.min.js" charset="utf-8"></script>

    <script type="text/javascript" src="https://rawgit.com/jieter/Leaflet.encoded/master/Polyline.encoded.js"></script>
    <style>
      html, body {
        height: 100%;
        padding: 0;
        margin: 0;
      }
      #map {
        /* configure the size of the map */
        width: 100%;
        height: 100%;
        z-index: 1;
      }

      #legend {
          position: absolute;
          right: 0;
          top: 0;
          bottom: 0;
          z-index: 300;
          display: flex;
          flex-direction: row;
      }

      #legend iframe {
          height: 100%;
      }

    </style>
    <title>Seth's eBike Map</title>
  </head>
  <body>
    <a href="/" | relative_url }}">Home</a>
    <div id="legend" style="width: 300px;">
        <button>❯</button>
        <div class="iframe" style="display: initial;"><iframe src="https://cyclosm.org/legend.html"></iframe></div>
    </div>
    <div id="map"></div>
        <script>
        // initialize Leaflet

        // add the OpenStreetMap base tiles

        var osm = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        });

        // Use Cycl-osm tiles for bike routes
        var cyclosm = L.tileLayer('https://{s}.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png', {
            maxZoom: 20,
            attribution: '<a href="https://github.com/cyclosm/cyclosm-cartocss-style/releases" title="CyclOSM - Open Bicycle render">CyclOSM</a> | Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });

        var ocm = L.tileLayer('https://{s}.tile.thunderforest.com/cycle/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: 'Maps © <a href="https://www.thunderforest.com/">Thunderforest</a> | Map data: &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        });


        // show a marker on the map
        var sanJose = L.marker({lon: -121.88, lat: 37.337}).bindPopup('San Jose');
        var santaClara = L.marker({lon: -121.936, lat: 37.353}).bindPopup('Santa Clara Caltrain');
        var mtv = L.marker({lon: -122.07, lat: 37.39}).bindPopup('Downtown Mountain View');

        var sf = L.marker({lon: -122.3949, lat: 37.7767}).bindPopup('SF 4th and King');

        var cities = L.layerGroup([sanJose, santaClara, mtv, sf]);

        var map = L.map('map',  {
            center: [33.337, -121.88],
            zoom: 7,
            layers: [cyclosm, osm, cities]
        });

        var baseMaps = {
            "OpenStreetMap": osm,
            "CyclOpenStreetMap": cyclosm,
            "OpenCycleMap": ocm,
        };

        var overlayMaps = {
            "Cities": cities
        };

        var layerControl = L.control.layers(baseMaps, overlayMaps).addTo(map);

        // With the script above, take the string from Strava and then decode it

        fetch('runs.csv')
            .then(response => response.text())
            .then(data => {
                const lines = data.split("\n")
                const array = lines.map(line => line.split(","));

                for(index = 1; index < array.length - 1; index++)
                {

                    const line = array[index]
                    // console.log(line);

                    try {
                        // console.log(line[1].trim());
                        var coordinates = L.Polyline.fromEncoded(line[1].trim());
                        // console.log(coordinates.getLatLngs());
                        var newpolyline = L.polyline([coordinates.getLatLngs()], {color: 'red'}).addTo(map);
                    }
                    catch(e) {}
                }
            })
        // show the scale bar on the lower left corner
        L.control.scale({imperial: true, metric: true}).addTo(map);
        L.control.locate({drawMarker: false, drawCircle: false}).addTo(map);

        // This is taken from Cyclosm.org
        // Very detailed comments and easily readable code that I would not have been
        // able to do otherwise.

        function storageAvailable(type) {
            try {
                var storage = window[type],
                    x = '__storage_test__';
                storage.setItem(x, x);
                storage.removeItem(x);
                return true;
            }
            catch(e) {
                console.warn("Your browser blocks access to " + type);
                return false;
            }
        }

        // =============
        // Handle legend
        // =============
        function handleResize() {
            var shouldLegendOpen = true;

            if (screen.width > 800) {
                shouldLegendOpen = true;
            } else {
                shouldLegendOpen = false;
            }
            if (storageAvailable('localStorage') && window.localStorage.isLegendOpen !== undefined) {
                shouldLegendOpen = JSON.parse(window.localStorage.isLegendOpen);
            }

            if (shouldLegendOpen) {
                document.querySelector('#map').style.right = '300px';
                document.querySelector('#legend .iframe').style.display = 'initial';
                document.querySelector('#legend').style.width = '300px';
                document.querySelector('#legend button').innerText = '❯';
            } else {
                document.querySelector('#map').style.right = '42px';
                document.querySelector('#legend .iframe').style.display = 'none';
                document.querySelector('#legend').style.width = '42px';
                document.querySelector('#legend button').innerText = '❮';
            }
        }
        handleResize();
        window.addEventListener('resize', handleResize());

        document.querySelector('#legend button').addEventListener('click', function (event) {
            event.preventDefault();

            if (document.querySelector('#legend button').innerText == '❮') {
                if (storageAvailable('localStorage')) {
                    window.localStorage.isLegendOpen = JSON.stringify(true);
                }
                document.querySelector('#map').style.right = '300px';
                document.querySelector('#legend .iframe').style.display = 'initial';
                document.querySelector('#legend').style.width = '300px';
                document.querySelector('#legend button').innerText = '❯';
            } else {
                if (storageAvailable('localStorage')) {
                    window.localStorage.isLegendOpen = JSON.stringify(false);
                }
                document.querySelector('#map').style.right = '42px';
                document.querySelector('#legend .iframe').style.display = 'none';
                document.querySelector('#legend').style.width = '42px';
                document.querySelector('#legend button').innerText = '❮';
            }
            map.invalidateSize();
        });

        </script>

    </body>
</html>
